plugins {
    id 'com.android.application'
}

android {
    namespace 'com.flappylula.mobile'
    compileSdk 37

    defaultConfig {
        applicationId 'com.flappylula.mobile'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
